[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.3.0",
    "pyjwt>=2.15.1",
    "pydantic-ai-slim[google,groq]>=2.61.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-google-genai>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Le code est importé comme dans `python src/main.py` (imports absolus depuis src/)
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# Installe les paquets par copie plutôt que par liens physiques : nltk (utilisé
# par LlamaIndex) refuse de lire ses fichiers de données s'ils sont des liens.
link-mode = "copy"
