# Lance les tests du backend et vérifie le build du frontend
# à chaque push et à chaque pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer Python et les dépendances
        run: uv sync --locked

      - name: Lancer les tests
        run: uv run pytest -v

  frontend-build:
    name: Lint et build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
